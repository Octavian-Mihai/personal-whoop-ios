name: PersonalWhoop
options:
  bundleIdPrefix: com.octa
  deploymentTarget:
    iOS: "17.0"
packages:
  StrandAnalytics:
    path: Packages/StrandAnalytics
targets:
  PersonalWhoop:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/PersonalWhoop.entitlements
      properties:
        com.apple.security.application-groups: [group.com.octa.personalwhoop]
    dependencies:
      - package: StrandAnalytics
        product: StrandAnalytics
      - package: StrandAnalytics
        product: WhoopProtocol
      - target: PersonalWhoopWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Personal Whoop
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: Connects to your heart-rate strap or WHOOP to read live data.
        UIBackgroundModes: [bluetooth-central]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octa.personalwhoop
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PersonalWhoopWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    entitlements:
      path: Widgets/PersonalWhoopWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.octa.personalwhoop]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Personal Whoop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octa.personalwhoop.widgets
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
